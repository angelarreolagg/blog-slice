<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img">
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f9fafb; }
    .band { fill: #f1f2f5; stroke: #e4e5ea; }
    .base { fill: #ebecf1; stroke: #dcdde4; }
    .label { fill: #2c2f38; font: 600 30px "Inter", system-ui, sans-serif; }
    .note { fill: #6a6e7a; font: 400 24px "Inter", system-ui, sans-serif; }
    .rule { stroke: #b5811f; stroke-width: 3; }
    .axis { fill: #8b8f9b; font: 400 22px "Inter", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17181c; }
      .band { fill: #232429; stroke: #2f3037; }
      .base { fill: #2a2b31; stroke: #35363d; }
      .label { fill: #eceef2; }
      .note { fill: #a6aab4; }
      .rule { stroke: #e0b25c; }
      .axis { fill: #858993; }
    }
  </style>
  <rect class="bg" width="1120" height="560" rx="12" />

  <rect class="band" x="330" y="60" width="620" height="130" rx="10" />
  <text class="label" x="360" y="112">Contratos de accesibilidad</text>
  <text class="note" x="360" y="152">Rol, ARIA, foco, teclado</text>

  <rect class="band" x="250" y="215" width="700" height="130" rx="10" />
  <text class="label" x="280" y="267">Comportamiento observable</text>
  <text class="note" x="280" y="307">Lo que una persona puede hacer y ver</text>

  <rect class="base" x="170" y="370" width="780" height="130" rx="10" />
  <text class="label" x="200" y="422">Lógica pura</text>
  <text class="note" x="200" y="462">Ordenar, filtrar, formatear</text>

  <line class="rule" x1="96" y1="500" x2="96" y2="60" stroke-linecap="round" />
  <text class="axis" x="60" y="530">más barata de escribir</text>
  <text class="axis" x="60" y="40">más cara de escribir</text>
</svg>
